{{- if and .Values.deepseek.enabled .Values.deepseek.apiKey }}
apiVersion: v1
kind: Secret
metadata:
  name: deepseek-api-key
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ztm.labels" . | nindent 4 }}
type: Opaque
stringData:
  api_key: {{ .Values.deepseek.apiKey | quote }}
{{- end }}
