{{- if and .Values.vault.enabled .Values.maas.apiKey }}
---
apiVersion: v1
kind: Secret
metadata:
  name: maas-api-key-ephemeral
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ztm.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
type: Opaque
stringData:
  apiKey: {{ .Values.maas.apiKey | quote }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: vault-seed-maas-{{ .Release.Revision }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ztm.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-4"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vault-seed-maas-job
    spec:
      serviceAccountName: vault-seed-job
      restartPolicy: Never
      containers:
        - name: vault-seed
          image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              VAULT_ADDR="{{ include "ztm.vaultInternalUrl" . }}"
              SA_TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              LOGIN_RESP=$(curl -sk --fail \
                --request POST \
                --data "{\"jwt\":\"${SA_TOKEN}\",\"role\":\"{{ .Values.vault.role }}\"}" \
                "${VAULT_ADDR}/v1/{{ .Values.vault.authPath }}/login" 2>/dev/null || echo "{}")
              VAULT_TOKEN=$(echo "${LOGIN_RESP}" | grep -o '"client_token":"[^"]*"' | head -1 | cut -d'"' -f4 || true)
              if [ -z "${VAULT_TOKEN}" ]; then
                echo "WARN: Vault auth failed; MAAS key will be stored as K8s Secret only"
                exit 0
              fi
              API_KEY=$(cat /secrets/apiKey)
              curl -sk --fail \
                --header "X-Vault-Token: ${VAULT_TOKEN}" \
                --request POST \
                --data "{\"data\":{\"api_key\":\"${API_KEY}\"}}" \
                "${VAULT_ADDR}/v1/secret/data/hub/infra/openshell/maas" || \
                echo "WARN: Vault write failed; proceeding anyway"
          volumeMounts:
            - name: api-key
              mountPath: /secrets
              readOnly: true
      volumes:
        - name: api-key
          secret:
            secretName: maas-api-key-ephemeral
{{- end }}
