{{- if .Values.vault.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: maas-api-key-es
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ztm.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.vault.clusterSecretStoreName }}
    kind: ClusterSecretStore
  target:
    name: maas-api-key
    creationPolicy: Merge
  data:
    - secretKey: api_key
      remoteRef:
        key: {{ .Values.vault.secretPath | trimPrefix "secret/data/" }}
        property: api_key
{{- end }}
{{- if and .Values.deepseek.enabled .Values.vault.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: deepseek-api-key-es
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ztm.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.vault.clusterSecretStoreName }}
    kind: ClusterSecretStore
  target:
    name: deepseek-api-key
    creationPolicy: Merge
  data:
    - secretKey: api_key
      remoteRef:
        key: hub/infra/openshell/deepseek
        property: api_key
{{- end }}
