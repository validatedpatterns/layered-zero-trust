enabled: true

loki:
  enabled: true
  namespace: netobserv-loki
  name: loki
  size: 1x.extra-small
  # Required by LokiStack CRD (spec.storageClassName). Must be set explicitly;
  # empty fails at template time. Helm lookup is not used (unsupported under
  # Argo CD). Set via one of:
  #   - chart values: loki.storageClassName: gp3-csi
  #   - helm: --set loki.storageClassName=gp3-csi
  #   - Argo CD / clusterGroup overrides (see scripts/features/netobserv.yaml):
  #       - name: loki.storageClassName
  #         value: "<YOUR-STORAGE-CLASS>"
  # Discover available classes: oc get storageclass
  storageClassName: ""
  storageSecretName: loki-s3
  objectBucketClaim:
    name: netobserv-loki-obc
    bucketName: netobserv-loki
    storageClass: openshift-storage.noobaa.io
  # NooBaa MCG default region used in remapped secret
  region: us-east-1

flowcollector:
  name: cluster
  namespace: netobserv
  deploymentModel: Direct
  agent:
    type: eBPF
    sampling: 50
    privileged: false
  loki:
    enable: true
    mode: LokiStack
  consolePlugin:
    enable: true

# NetworkPolicies: FlowCollector manages netobserv / netobserv-privileged;
# the chart adds least-privilege policies for netobserv-loki (LokiStack).
networkPolicy:
  enabled: true

credentialsJob:
  image: registry.redhat.io/openshift4/ose-cli-rhel9:latest
  backoffLimit: 5
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
