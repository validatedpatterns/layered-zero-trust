{{- if and (include "qtodo.registryAuth.enabled" .) (include "qtodo.quayTokenGenerator.enabled" .) }}
{{- $gen := .Values.app.images.main.registry.quayTokenGenerator }}
{{- $regDomain := tpl (required "registry domain is required (set app.images.main.registry.domain or global.registry.domain)" (.Values.app.images.main.registry.domain | default .Values.global.registry.domain)) . }}
{{- $repository := .Values.global.registry.repository | default "" }}
{{- if not (contains "/" $repository) }}
{{- fail "quayTokenGenerator requires global.registry.repository in the form <organization>/<name>" }}
{{- end }}
{{- $robot := printf "%s+%s" (index (splitList "/" $repository) 0) $gen.robot }}
# ============================================================
# Short-lived Quay pull token for qtodo
#
# 1. qtodo-quay-federation-jwt (VaultDynamicSecret): ESO logs in to Vault
#    with a token of the quay-pull-token SA (Kubernetes auth, validated
#    with TokenReview) and reads identity/oidc/token/<vaultRole>: a JWT
#    signed by Vault, sub=<Vault entity>, aud=quay, ~15 min lifetime.
# 2. qtodo-quay-token (Webhook): ESO exchanges that JWT at
#    https://<registry>/oauth2/federation/robot/token for a one-hour token
#    of the <org>+<robot> robot, which only has "read" on the repository.
# 3. registry-external-secret.yaml renders it as the image pull secret.
# ============================================================
---
# Identity of the pull robot. No pod runs with it: only ESO requests
# tokens for it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $gen.serviceAccount }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
automountServiceAccountToken: false
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: VaultDynamicSecret
metadata:
  name: qtodo-quay-federation-jwt
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "34"
spec:
  method: GET
  path: {{ printf "identity/oidc/token/%s" $gen.vaultRole | quote }}
  resultType: Data
  provider:
    server: {{ include "qtodo.quayTokenGenerator.vaultUrl" . | quote }}
    caProvider:
      type: ConfigMap
      name: kube-root-ca.crt
      key: ca.crt
    auth:
      kubernetes:
        mountPath: {{ $gen.vaultAuthMount | quote }}
        role: {{ $gen.vaultRole | quote }}
        serviceAccountRef:
          name: {{ $gen.serviceAccount }}
          audiences:
            - {{ $gen.vaultAudience | quote }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $gen.federationSecret }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "34"
spec:
  refreshInterval: {{ $gen.federationTokenRefreshInterval | quote }}
  target:
    name: {{ $gen.federationSecret }}
    template:
      type: Opaque
      metadata:
        labels:
          # Required by ESO to allow the Webhook generator to read it
          external-secrets.io/type: webhook
      data:
        token: "{{ `{{ .token }}` }}"
  dataFrom:
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: VaultDynamicSecret
        name: qtodo-quay-federation-jwt
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Webhook
metadata:
  name: qtodo-quay-token
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "35"
spec:
  method: GET
  url: {{ printf "https://%s/oauth2/federation/robot/token" $regDomain | quote }}
  headers:
    Authorization: {{ printf "Basic {{ print %q \":\" .federation.token | b64enc }}" $robot | quote }}
  caProvider:
    type: ConfigMap
    name: kube-root-ca.crt
    key: ca.crt
  # Quay answers {"token": "<robot token>"}; every key becomes an output key
  result: {}
  secrets:
  - name: federation
    secretRef:
      name: {{ $gen.federationSecret }}
{{- end }}
