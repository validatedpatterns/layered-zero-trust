apiVersion: platform.stackrox.io/v1alpha1
kind: SecuredCluster
metadata:
  name: stackrox-secured-cluster-services
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "acs-secured-cluster.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "46"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  clusterName: {{ .Values.clusterName | default .Values.global.clusterName | quote }}

  {{- /*
    Honour .Values.centralEndpoint when set, falling back to the public route.

    The route is correct for a spoke, where Central lives on another cluster. It
    is wrong when Central is local: Central's serving certificate carries only
    DNS:central.stackrox and DNS:central.stackrox.svc, and the route is
    passthrough, so the sensor is presented Central's own certificate under a
    hostname that is not in its SANs and the handshake fails with

      x509: certificate is valid for central.stackrox, central.stackrox.svc,
      not central-stackrox.<domain>

    Set centralEndpoint to central.stackrox.svc:443 on the hub, where that name
    does match. The value already existed here but was never read.
  */}}
  centralEndpoint: {{ .Values.centralEndpoint | default (printf "central-stackrox.%s:443" .Values.global.localClusterDomain) }}

  {{- if .Values.admissionControl.enabled }}
  admissionControl:
    enforcement: {{ .Values.admissionControl.enforcement | default "Enabled" }}
    listenOnCreates: {{ .Values.admissionControl.listenOnCreates }}
    listenOnUpdates: {{ .Values.admissionControl.listenOnUpdates }}
    listenOnEvents: {{ .Values.admissionControl.listenOnEvents }}
    bypass: BreakGlassAnnotation
    contactImageScanners: DoNotScanInline
    timeoutSeconds: {{ .Values.admissionControl.timeoutSeconds }}
  {{- end }}

  {{- if .Values.sensor.enabled }}
  sensor:
    resources:
      {{- toYaml .Values.sensor.resources | nindent 6 }}
  {{- end }}

  {{- if .Values.collector.enabled }}
  perNode:
    collector:
      collection: {{ .Values.collector.collectionMethod }}
      imageFlavor: {{ .Values.collector.imageFlavor }}
    taintToleration: TolerateTaints
  {{- end }}

  auditLogs:
    collection: Auto

  {{- if .Values.monitoring.enabled }}
  monitoring:
    {{- if .Values.monitoring.openshift.enabled }}
    openshift:
      enabled: true
    {{- end }}
  {{- end }}

  tls:
    additionalCAs: []