{{- if .Values.cleanup.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cleanup-keycloak-setup
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cleanup-keycloak-setup
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["list", "delete"]
- apiGroups: ["k8s.keycloak.org"]
  resources: ["keycloakrealmimports"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cleanup-keycloak-setup
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cleanup-keycloak-setup
subjects:
- kind: ServiceAccount
  name: cleanup-keycloak-setup
  namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: cleanup-keycloak-setup
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app: cleanup-keycloak-setup
    spec:
      serviceAccountName: cleanup-keycloak-setup
      restartPolicy: Never
      containers:
      - name: cleanup
        image: {{ .Values.cleanup.image }}
        command:
        - /bin/bash
        - -ce
        - |
          echo "Waiting for ztvp-realm-import to complete before cleanup..."
          TIMEOUT=540
          ELAPSED=0
          IMPORT_DONE=false
          while [ $ELAPSED -lt $TIMEOUT ]; do
            DONE=$(oc get keycloakrealmimport ztvp-realm-import \
              -n "{{ .Release.Namespace }}" \
              -o jsonpath='{.status.conditions[?(@.type=="Done")].status}' 2>/dev/null || echo "")
            ERRORS=$(oc get keycloakrealmimport ztvp-realm-import \
              -n "{{ .Release.Namespace }}" \
              -o jsonpath='{.status.conditions[?(@.type=="HasErrors")].status}' 2>/dev/null || echo "")
            if [ "$DONE" = "True" ]; then
              echo "Realm import finished successfully"
              IMPORT_DONE=true
              break
            fi
            if [ "$ERRORS" = "True" ]; then
              echo "Realm import has errors (${ELAPSED}s elapsed) — keeping secrets so the Job can retry, waiting 15s..."
            else
              echo "Realm import still in progress (${ELAPSED}s elapsed), waiting 15s..."
            fi
            sleep 15
            ELAPSED=$((ELAPSED + 15))
          done
          if [ "$IMPORT_DONE" != "true" ]; then
            echo "Timeout waiting for realm import (Done never became True). Leaving secrets intact — retry this hook after the import completes." >&2
            exit 1
          fi
          oc delete secret -l "validatedpatterns.io/cleanup=delete" \
            -n "{{ .Release.Namespace }}" --ignore-not-found
          echo "Cleanup complete."
{{- end }}
