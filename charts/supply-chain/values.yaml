# Default values for supply-chain
global:
  hubClusterDomain: hub.example.com
  namespace: pipeline
  secretStore:
    name: "vault-backend"
    kind: "ClusterSecretStore"
  registry:
    enabled: false
    domain: ""
    repository: ""
    user: ""
    vaultPath: ""
    passwordVaultKey: ""
    # Short-lived Quay robot tokens (built-in Quay registry only).
    # Setting it here enables it for every chart that consumes global.registry.
    quayTokenGenerator:
      enabled: false

rhtas:
  enabled: false
  spire:
    enabled: true
  oidc:
    enabled: false
    clientId: ""
    clientSecretName: "rhtas-oidc-client-secret"
    clientSecretVaultPath: "secret/data/hub/infra/rhtas/rhtas-oidc-client-secret"
    clientSecretVaultKey: "client-secret"
    issuer: ""
    identity: ""

rhtpa:
  enabled: false
  url: ""
  oidc:
    enabled: true
    url: ""
    realm: "ztvp" # Keycloak realm to use for authentication
    apiId: "" # Azure Entra ID Application (client) ID - UUID only
    clientId: "rhtpa-cli"
    clientSecretName: "qtodo-rhtpa-cli-password"
    # RHTPA OIDC CLI secret path (infra)
    clientSecretVaultPath: "secret/data/hub/infra/rhtpa/rhtpa-oidc-cli"
    clientSecretVaultKey: "client-secret"

# git credentials for protected repositories
git:
  credentials:
    enabled: false
    authType: "https"
    host: "https://github.com"
    vaultPath: "secret/data/hub/supply-chain/git-credentials"
    usernameKey: "username"
    passwordKey: "password"
    sshPrivateKeyKey: "ssh-privatekey"
    knownHostsKey: "known_hosts"
  # Corporate/custom CA bundle for HTTPS git clones from internal hosts.
  # When enabled, the git-clone task mounts the CA ConfigMap as the
  # ssl-ca-directory workspace so TLS verification succeeds against
  # internal Git servers (e.g. GitLab behind a corporate CA).
  sslCABundle:
    enabled: false
    configMapName: "ztvp-trusted-ca"

# qtodo repository configuration
qtodo:
  repository: "https://github.com/validatedpatterns-demos/qtodo.git"
  revision: "main"
  image:
    name: "quay.io/validatedpatterns/qtodo"
    version: "latest"
  buildCmd: "./mvnw -s settings.xml package -DskipTests -Dquarkus.package.jar.type=uber-jar"
  containerfile: "./Containerfile"

# ===========================================================================
# QUAY USER PROVISIONER (only for built-in Quay registry)
# When enabled, runs a CronJob that provisions users in the built-in Quay instance.
# This is Quay-specific and not needed for BYO or embedded OpenShift registries.
# ===========================================================================
quay:
  enabled: false
  email: "quay-user@example.com"
  job:
    image: registry.access.redhat.com/ubi9/ubi:9.7-1764794285
    schedule: "*/5 * * * *"

# ===========================================================================
# REGISTRY CONFIGURATION (option-agnostic)
# Works for all registry types: built-in Quay, BYO (quay.io, ghcr.io, etc.),
# or embedded OpenShift image registry. Set the values for your scenario.
#
# Scenario-specific values (set in values-hub.yaml overrides):
#   Built-in Quay:
#     domain: quay-registry-quay-quay-enterprise.apps.<clusterDomain>
#     vaultPath: secret/data/hub/infra/quay/quay-users
#     passwordVaultKey: quay-user-password
#   BYO (quay.io, ghcr.io, etc.):
#     domain: quay.io (or your registry hostname)
#     vaultPath: secret/data/hub/infra/registry/registry-user
#     passwordVaultKey: registry-password
#   Embedded OpenShift:
#     domain: default-route-openshift-image-registry.apps.<clusterDomain>
#     vaultPath: secret/data/hub/infra/registry/registry-user
#     passwordVaultKey: registry-password
#     embeddedOpenShift.ensureImageNamespaceRBAC: true
# ===========================================================================
registry:
  # Set to true to create the registry auth secret (dockerconfigjson)
  enabled: false
  # Registry hostname (REQUIRED when enabled)
  domain: ""
  # Repository path within the registry, e.g. "ztvp/qtodo"
  # (falls back to global.registry.repository)
  repository: ""
  # Whether to verify TLS when pushing to the registry
  tlsVerify: "true"
  # Registry username (falls back to global.registry.user)
  user: ""
  # Vault path to the secret containing the registry password
  vaultPath: ""
  # Key within the Vault secret that holds the password
  passwordVaultKey: ""
  # Secret name for registry auth (dockerconfigjson)
  authSecretName: "qtodo-registry-auth"
  # Embedded OpenShift registry only: create image namespace and grant
  # pipeline SA system:image-builder so the pipeline can push. Set to true only when
  # using the in-cluster OpenShift image registry; leave false for other registries.
  embeddedOpenShift:
    ensureImageNamespaceRBAC: false
    # Service account name for the route-enabler Job
    routeEnablerServiceAccount: "registry-route-enabler"
    tokenRefresher:
      enabled: false
      schedule: "0 */6 * * *"
      tokenDuration: "172800"

# ===========================================================================
# SHORT-LIVED QUAY ROBOT TOKENS (built-in Quay registry only)
# Instead of rendering the Quay admin password into registry.authSecretName,
# External Secrets Operator generators chain two short-lived credentials:
#   1. VaultDynamicSecret: ESO logs in to Vault with a token of a dedicated
#      ServiceAccount (Kubernetes auth / TokenReview) and gets a JWT signed by
#      the Vault identity OIDC provider (~15 min, aud=quay).
#   2. Webhook: ESO exchanges that JWT for a one-hour Quay robot token
#      (Quay robot account federation trusting the Vault OIDC issuer).
# The pipeline pushes with a robot that only has "write" on the repository;
# qtodo pulls with a "read" robot. The Quay admin password is then only used
# by the robot provisioner Job.
# Also enabled when global.registry.quayTokenGenerator.enabled=true.
#
# PREREQUISITES (see docs/quay-short-lived-tokens.md):
#   - Red Hat Quay 3.13 or later (robot account federation)
#   - Vault identity OIDC configured by the configure-vault-quay-federation
#     imperative job (overrides/values-vault-quay-federation.yaml). The
#     identity names/ServiceAccounts below must match that file.
#   - Quay trusts the ingress CA (ztvp-certificates proxyCA.enabled)
# ===========================================================================
quayTokenGenerator:
  enabled: false
  vault:
    # Defaults to the Vault route: https://vault-vault.<global.hubClusterDomain>
    url: ""
    # Kubernetes auth mount used by the VaultDynamicSecret generators
    authMount: "hub"
    # Audience of the ServiceAccount tokens presented to Vault
    audience: "vault"
  # How often ESO requests a new Vault identity JWT (must be lower than the
  # Vault identity token TTL, 15 min by default)
  federationTokenRefreshInterval: "10m"
  # How often ESO exchanges a new robot token (Quay tokens last one hour)
  refreshInterval: "55m"
  # Robot used by the pipeline to push (role "write" on the repository).
  # Robots are created in the organization of registry.repository
  # (e.g. "ztvp" from "ztvp/qtodo"): <org>+<robot>
  pusher:
    robot: "pipeline"
    # ServiceAccount of the identity (no pods use it)
    serviceAccount: "quay-push-token"
    # Vault Kubernetes auth role and identity OIDC role (same name)
    vaultRole: "quay-pipeline-pusher"
    # Secret holding the short-lived Vault identity JWT
    federationSecret: "quay-push-federation-jwt"
  # Robots used by workloads that run the image (role "read").
  # Their generators live in the workload chart (e.g. qtodo); the provisioner
  # reads federationSecret in <namespace> to learn the Vault entity (sub).
  pullers:
    - robot: "qtodo"
      namespace: "qtodo"
      federationSecret: "quay-pull-federation-jwt"
  # Job/CronJob that creates the robots, their federation and permissions
  provisioner:
    serviceAccount: "quay-robot-provisioner"
    schedule: "*/15 * * * *"

# Container images used by Jobs and CronJobs (externalized for overridability)
images:
  ubi: "registry.access.redhat.com/ubi9/ubi:9.7-1764794285"
  spiffeHelper: "registry.redhat.io/zero-trust-workload-identity-manager/spiffe-helper-rhel9:v0.10.0"

# Service account name used by pipeline Jobs (CronJob, seed Job)
pipelineServiceAccount: "pipeline"

# pipeline run configuration
pipelinerun:
  # Set to true to automatically trigger a pipeline run on ArgoCD sync
  enabled: false

# spire configuration
spire:
  enabled: true
  endpointSocketPath: "/spiffe-workload-api/spire-agent.sock"

# workspaces configuration
storage:
  pvcs:
    - name: qtodo-workspace-source
      storageClass: ""
      size: "2Gi"
      accessMode: ReadWriteOnce

# tekton tasks configuration
tasks:
  images:
    cosign: "registry.access.redhat.com/ubi9/ubi:9.7-1764794285"
    mandrel: "registry.redhat.io/quarkus/mandrel-for-jdk-21-rhel8:23.1-36"
    syft: "registry.redhat.io/rh-syft-tech-preview/syft-rhel9:1.29.0"
    rhtpa: "registry.access.redhat.com/ubi9/ubi:9.7-1764794285"
    skopeo: "registry.access.redhat.com/ubi9/skopeo:9.5-1745865345@sha256:d91eb0dac7308ddfb12193368a42009509925edba80da9ffd3b82d03427dc3ed"
