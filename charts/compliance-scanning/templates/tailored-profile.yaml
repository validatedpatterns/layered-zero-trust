{{- if .Values.compliance.tailoredProfile.enabled }}
{{- /*
Optional TailoredProfile, so the cluster can deviate from a stock baseline on
specific rules/variables instead of forking the whole profile.

Sync-wave -11 (one ahead of the ScanSettingBinding at -10): the binding is
rejected if the TailoredProfile it references does not exist yet.

To actually scan against this, point the binding at it:
  compliance.scanSettingBinding.profileKind: TailoredProfile
  compliance.scanSettingBinding.profile: <this name>
*/}}
apiVersion: compliance.openshift.io/v1alpha1
kind: TailoredProfile
metadata:
  name: {{ .Values.compliance.tailoredProfile.name }}
  namespace: openshift-compliance
  annotations:
    argocd.argoproj.io/sync-wave: '-11'
  labels:
    app.kubernetes.io/component: compliance-tailored-profile
spec:
  extends: {{ .Values.compliance.tailoredProfile.extends }}
  title: {{ .Values.compliance.tailoredProfile.title | quote }}
  description: {{ .Values.compliance.tailoredProfile.description | quote }}
  {{- with .Values.compliance.tailoredProfile.disableRules }}
  disableRules:
    {{- range . }}
    - name: {{ .name }}
      rationale: {{ .rationale | quote }}
    {{- end }}
  {{- end }}
  {{- with .Values.compliance.tailoredProfile.enableRules }}
  enableRules:
    {{- range . }}
    - name: {{ .name }}
      rationale: {{ .rationale | quote }}
    {{- end }}
  {{- end }}
  {{- with .Values.compliance.tailoredProfile.setValues }}
  setValues:
    {{- range . }}
    - name: {{ .name }}
      rationale: {{ .rationale | quote }}
      value: {{ .value | quote }}
    {{- end }}
  {{- end }}
{{- end }}
