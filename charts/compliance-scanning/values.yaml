global:
  localClusterDomain: local.example.com

compliance:
  # ScanSetting configuration
  scanSetting:
    name: compliance-scan-setting
    # Enable automatic remediation
    autoApplyRemediations: true
    # Schedule scan 
    schedule: ""
    # Set scanning tolerations
    scanTolerations:
      - key: "node-role.kubernetes.io/master"
        operator: "Exists"
        effect: "NoSchedule"
    # Node selector for scanner pods
    nodeSelector: {}
  scanSettingBinding:
    name: compliance-scan-binding
    # Profile in oc get profiles.compliance -n openshift-compliance
    profile: "ocp4-moderate-voicd"
    # "Profile" for a stock baseline, "TailoredProfile" for the one below.
    profileKind: "TailoredProfile"
  # Deviations from the stock baseline. ARCH-486: console/CLI sessions get a
  # fixed 12h lifetime with no idle logout.
  #
  # Stock ocp4-moderate auto-remediates oauth/cluster to
  # accessTokenInactivityTimeout=10m0s and accessTokenMaxAgeSeconds=86400, which
  # logged admins and `oc` users out after 10 minutes idle. Because remediation
  # is re-applied every scan, editing oauth/cluster directly never stuck — the
  # deviation has to be expressed here.
  tailoredProfile:
    enabled: true
    name: ocp4-moderate-voicd
    extends: ocp4-moderate
    title: "Voicd OCP4 Moderate (12h absolute OAuth session, no inactivity timeout)"
    description: >-
      Extends ocp4-moderate. Disables the OAuth inactivity-timeout control and
      lowers the OAuth token max-age variable to 12h (43200s), giving console
      and CLI sessions a fixed 12h lifetime with no idle logout (ARCH-486). All
      other moderate controls are inherited unchanged.
    disableRules:
      - name: ocp4-oauth-or-oauthclient-inactivity-timeout
        rationale: >-
          Operational requirement is a fixed-length session, not an idle
          timeout. Session bounding is provided instead by
          accessTokenMaxAgeSeconds=43200 (12h) via the
          ocp4-oauth-or-oauthclient-token-maxage rule. Accepted trade-off
          against the moderate OAuth-session-inactivity control.
    enableRules: []
    setValues:
      - name: ocp4-var-oauth-token-maxage
        rationale: >-
          12h absolute session lifetime per ARCH-486, replacing the 24h
          default. This is the control that now bounds session length, since
          the inactivity-timeout rule is disabled.
        value: "43200"
  # Storage configuration for scan results
  storage:
    # Enable PVC creation
    enabled: true
    pvc:
      name: compliance-scan-results
      storageClass: ""
      size: "2Gi"
      accessMode: "ReadWriteOnce"

hardening:
  # etcd encryption at rest configuration
  etcdEncryption:
    # Enable etcd encryption by patching the existing APIServer resource
    enabled: false
    # Encryption type: aescbc, aesgcm, or kms v2
    type: "aescbc"