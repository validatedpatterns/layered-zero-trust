---
# Red Hat Quay container registry (validatedpatterns/quay-chart v0.2+)
# Depends on: storage (ODF + noobaa-mcg). overrides/values-quay.yaml uses objectStorage.mode=odf.
clusterGroup:
  namespaces:
    quay-enterprise:
      annotations:
        argocd.argoproj.io/sync-wave: "32"
      labels:
        openshift.io/cluster-monitoring: "true"

  subscriptions:
    quay-operator:
      name: quay-operator
      namespace: openshift-operators
      annotations:
        argocd.argoproj.io/sync-wave: "28"

  applications:
    quay-registry:
      name: quay-registry
      namespace: quay-enterprise
      project: hub
      chart: quay
      chartVersion: 0.2.*
      extraValueFiles:
        - /overrides/values-quay.yaml
      annotations:
        argocd.argoproj.io/sync-wave: "41"
