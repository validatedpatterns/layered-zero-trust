# Network Observability
# Depends on: storage (NooBaa MCG for Loki object storage)
clusterGroup:
  namespaces:
    openshift-operators-redhat:
      operatorGroup: true
      targetNamespaces: []
      annotations:
        argocd.argoproj.io/sync-wave: "26"
    openshift-netobserv-operator:
      operatorGroup: true
      targetNamespaces: []
      labels:
        openshift.io/cluster-monitoring: "true"
      annotations:
        argocd.argoproj.io/sync-wave: "26"
    netobserv-loki:
      annotations:
        argocd.argoproj.io/sync-wave: "26"
    netobserv:
      labels:
        openshift.io/cluster-monitoring: "true"
      annotations:
        argocd.argoproj.io/sync-wave: "26"

  subscriptions:
    loki-operator:
      name: loki-operator
      namespace: openshift-operators-redhat
      source: redhat-operators
      annotations:
        argocd.argoproj.io/sync-wave: "27"
    netobserv-operator:
      name: netobserv-operator
      namespace: openshift-netobserv-operator
      channel: stable
      source: redhat-operators
      annotations:
        argocd.argoproj.io/sync-wave: "28"

  applications:
    netobserv:
      name: netobserv
      namespace: netobserv
      project: hub
      path: charts/netobserv
      annotations:
        argocd.argoproj.io/sync-wave: "42"
      # Required: replace with a StorageClass on the cluster (oc get storageclass).
      # Chart fails at template time if loki.storageClassName is empty.
      overrides:
        - name: loki.storageClassName
          value: "<YOUR-STORAGE-CLASS>"
      ignoreDifferences:
        - group: flows.netobserv.io
          kind: FlowCollector
          jsonPointers:
            - /spec/agent/ebpf/cacheActiveTimeout
            - /spec/agent/ebpf/cacheMaxFlows
            - /spec/agent/ebpf/excludeInterfaces
            - /spec/agent/ebpf/imagePullPolicy
            - /spec/agent/ebpf/kafkaBatchSize
            - /spec/agent/ebpf/logLevel
            - /spec/agent/ebpf/metrics
            - /spec/agent/ebpf/resources
            - /spec/agent/ipfix
            - /spec/consolePlugin/autoscaler
            - /spec/consolePlugin/imagePullPolicy
            - /spec/consolePlugin/logLevel
            - /spec/consolePlugin/portNaming
            - /spec/consolePlugin/quickFilters
            - /spec/consolePlugin/replicas
            - /spec/consolePlugin/resources
            - /spec/execution
            - /spec/kafka
            - /spec/loki/manual
            - /spec/loki/microservices
            - /spec/loki/monolithic
            - /spec/loki/readTimeout
            - /spec/loki/writeBatchSize
            - /spec/loki/writeBatchWait
            - /spec/loki/writeTimeout
            - /spec/processor
            - /spec/prometheus
